name: CricStrike 3D CI & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-headless:
    name: Run Headless Physics & Timing Tests
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.3
      GODOT_STATUS: stable

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Godot Binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /tmp/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-linux-x86_64

      - name: Download & Install Godot Engine Headless
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          rm -f /tmp/godot.zip

      - name: Set Godot in PATH
        run: |
          echo "/tmp/godot" >> $GITHUB_PATH

      - name: Verify Godot Installation
        run: |
          godot --version

      - name: Import Godot Project (Build Class Cache)
        run: |
          godot --headless --editor --quit

      - name: Run Phase 1 Headless Physics, Pitch & Batting Timing Tests
        run: |
          godot --headless --script test/run_tests.gd

  build-android-apk:
    name: Build Android Debug APK
    needs: test-headless
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      GODOT_VERSION: 4.3
      GODOT_STATUS: stable

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Build Tools in PATH
        run: |
          BUILD_TOOLS_VERSION=$(ls /usr/local/lib/android/sdk/build-tools | tail -n 1)
          echo "/usr/local/lib/android/sdk/build-tools/$BUILD_TOOLS_VERSION" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Cache Godot Binary & Export Templates
        id: cache-godot-templates
        uses: actions/cache@v4
        with:
          path: |
            /tmp/godot
            ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}

      - name: Download Godot Binary & Export Templates
        if: steps.cache-godot-templates.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot

          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/
          rm -rf /tmp/godot.zip /tmp/templates.tpz /tmp/templates

      - name: Set Godot in PATH
        run: |
          echo "/tmp/godot" >> $GITHUB_PATH

      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -keysize 2048 -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -deststoretype pkcs12

      - name: Configure Godot Editor Settings for Android Export
        run: |
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/debug_keystore = "$(pwd)/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF

      - name: Import Godot Project
        run: |
          godot --headless --editor --quit

      - name: Export Android Debug APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/cricstrike_3d_raw.apk

      - name: Zipalign & Sign APK with v1, v2, v3 Signature Schemes
        run: |
          zipalign -v -f -p 4 build/cricstrike_3d_raw.apk build/cricstrike_3d.apk
          apksigner sign --ks debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true build/cricstrike_3d.apk
          apksigner verify --verbose build/cricstrike_3d.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cricstrike-3d-android-apk
          path: build/cricstrike_3d.apk
          retention-days: 14

      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v3.1.0-upright-characters-and-downloader
          name: "CricStrike 3D v3.1.0 (Upright Standing 3D Characters & In-Game Asset Downloader)"
          body: |
            ### CricStrike 3D - Upright 3D Characters & Dynamic Asset Downloader (v3.1.0)
            100% Offline 3D Mobile Cricket Game inspired by "Real Cricket" and "WCC2" built in Godot Engine 4.3.

            #### Major Upgrades in v3.1.0:
            - **100% Upright Skeletal Poses**: Fixed coordinate space root rotation bug so batsman, bowler, 11 fielders, and umpires stand naturally on their feet rather than lying flat on the turf.
            - **In-Game Dynamic HD Asset Downloader**: Built an in-game expansion downloader hub (like Real Cricket & WCC) allowing the game to maintain a fast, compact Play Store install size while dynamically downloading and mounting HD Stadiums, Commentary Audio, and Pro Team Kits via Godot's `ProjectSettings.load_resource_pack()`.
            - **Motion-Captured Animation Suite**: Smooth batting stance, drive swings, lofted pulls, bowler run-up stride, overarm delivery, fielder pursuit sprint cycles, and wicketkeeper stance.
            - **Multi-POV Cameras**: 6 dynamic camera modes (Behind Batsman, Helmet POV, Bowler POV, Umpire POV, Broadcast TV, Ball Tracking).

            - **Direct Download**: Tap `cricstrike_3d.apk` below directly to install on your phone.
            - **Signatures**: Verified with APK Signature Schemes v1, v2, and v3 (compatible with Android 8 - 15).
            - **Architectures**: arm64-v8a + armeabi-v7a.
          files: build/cricstrike_3d.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
