<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#001f54"/>
      <stop offset="100%" stop-color="#034078"/>
    </linearGradient>

    <!-- Golden Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="40%" stop-color="#F2A900"/>
      <stop offset="100%" stop-color="#D47A00"/>
    </linearGradient>

    <!-- Ball Flame Gradient -->
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="50%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#7B1113"/>
    </radialGradient>

    <!-- Electric Lightning / Seam Glow -->
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#FF007A"/>
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Rounded Shield Icon Frame -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85"/>

  <!-- Stadium Floodlight Rays Behind -->
  <path d="M 60,0 L 256,220 L 140,0 Z" fill="#ffffff" opacity="0.04"/>
  <path d="M 452,0 L 256,220 L 372,0 Z" fill="#ffffff" opacity="0.04"/>
  <path d="M 256,256 m -180,0 a 180,180 0 1,0 360,0 a 180,180 0 1,0 -360,0" fill="none" stroke="url(#electricGrad)" stroke-width="4" opacity="0.4" stroke-dasharray="14,10"/>

  <!-- Crossed Cricket Bats in 3D Angle -->
  <g id="bats" filter="url(#neonGlow)">
    <!-- Left Bat -->
    <path d="M 120,400 L 280,150 L 305,166 L 145,416 Z" fill="url(#goldGrad)"/>
    <path d="M 292,158 L 340,82 L 354,91 L 306,167 Z" fill="#2c3e50"/>
    <path d="M 334,92 L 346,73 L 358,81 L 346,100 Z" fill="#e74c3c"/>

    <!-- Right Bat -->
    <path d="M 392,400 L 232,150 L 207,166 L 367,416 Z" fill="url(#goldGrad)"/>
    <path d="M 220,158 L 172,82 L 158,91 L 206,167 Z" fill="#2c3e50"/>
    <path d="M 178,92 L 166,73 L 154,81 L 166,100 Z" fill="#e74c3c"/>
  </g>

  <!-- Electric Speed Ball in Center Forefront -->
  <g id="cricketBall">
    <!-- Ball Motion Blur Arc -->
    <path d="M 150,310 A 130,130 0 0,1 360,310" fill="none" stroke="#00F0FF" stroke-width="12" stroke-linecap="round" opacity="0.65" filter="url(#neonGlow)"/>
    
    <!-- Red Leather Cricket Ball -->
    <circle cx="256" cy="225" r="74" fill="url(#ballGrad)" stroke="#FFE066" stroke-width="3"/>
    
    <!-- Stitched Seam -->
    <path d="M 205,178 Q 256,225 307,272" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="7,5" fill="none"/>
    <path d="M 209,174 Q 260,221 311,268" stroke="#FFE066" stroke-width="2" fill="none" opacity="0.8"/>

    <!-- Ball Specular Highlight -->
    <ellipse cx="230" cy="195" rx="20" ry="12" transform="rotate(-30 230 195)" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- High-Energy Lightning Strike -->
  <polygon points="256,90 270,165 245,175 275,260 230,185 252,175" fill="#00F0FF" filter="url(#neonGlow)"/>

  <!-- Bold Metallic Typography: CRICSTRIKE 3D -->
  <g id="logoText">
    <!-- Drop Shadow -->
    <text x="256" y="445" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" font-style="italic" letter-spacing="3" text-anchor="middle" fill="#000000" opacity="0.75">CRICSTRIKE</text>
    <!-- Foreground Text -->
    <text x="256" y="440" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" font-style="italic" letter-spacing="3" text-anchor="middle" fill="url(#goldGrad)" stroke="#111111" stroke-width="2">CRICSTRIKE</text>

    <!-- 3D Pill Badge -->
    <rect x="206" y="458" width="100" height="34" rx="8" fill="#FF1744" stroke="#FFE066" stroke-width="2"/>
    <text x="256" y="482" font-family="'Impact', 'Arial Black', sans-serif" font-size="22" font-weight="bold" font-style="italic" letter-spacing="4" text-anchor="middle" fill="#FFFFFF">3D</text>
  </g>
</svg>
